{% extends 'base.html' %}
{% load static %}

{% block extra-head %}
<link rel="stylesheet" href="{% static 'login.css'%}">
{% endblock %}

{% block content %}
<div class="container">
    <h1 class="title">WELCOME BACK</h1>
    <h1 class="title">Sign in to your account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form }}
        <button type="submit" class="btn btn-dark">Login</button>
    </form>
    <p>Don't have an account?</p>
    <a type="button" class="btn btn-warning" href="{% url 'register' %}">Create one. It's free!</a>
</div>
{% endblock %}
