services:
  db:
    container_name: trd_db
    image: postgres:15.17
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - trd-network

networks:
  trd-network:
    name: trd-network

volumes:
  postgres-data:
